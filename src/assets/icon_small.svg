<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3050"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="0.55" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#9ece6a"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9ece6a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9ece6a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#3b4261" stroke-width="3"/>
  <!-- fitness area under the curve -->
  <path d="M84 300 L150 300 L176 230 L204 352 L232 268 L252 300 C300 300 330 250 360 200 C380 166 398 140 420 124 L420 414 L84 414 Z" fill="url(#area)"/>
  <!-- pulse that turns into a rising fitness curve -->
  <path d="M84 300 L150 300 L176 230 L204 352 L232 268 L252 300 C300 300 330 250 360 200 C380 166 398 140 420 124"
        fill="none" stroke="url(#line)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="420" cy="124" r="60" fill="url(#glow)"/>
  <circle cx="420" cy="124" r="32" fill="#9ece6a"/>
  <circle cx="420" cy="124" r="12" fill="#1a1b26"/>
</svg>
